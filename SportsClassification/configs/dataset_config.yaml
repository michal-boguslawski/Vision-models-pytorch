# dataset_config.yaml
name: sports_images

source: kaggle
kaggle_dataset_name: gpiosenka/sports-classification
force_download: false
root_dir: data
raw_subdir: raw
processed_subdir: processed
annotations_subdir: annotations
annotations_file: sports.csv
use_existing_train_test_split: true
train_subdir: train
val_subdir: val
test_subdir: test

input_size: [224, 224]
normalize_mean: [0.4714, 0.4699, 0.4551]
normalize_std: [0.2391, 0.2302, 0.2320]
augmentations:
  horizontal_flip: true           # good for left/right invariance
  rotation: true                  # small rotations
  random_crop: false              # use either RandomCrop or RandomResizedCrop, not both
  random_resized_crop: true       # better than random_crop for generalization
  color_jitter: true              # slight brightness/contrast/saturation adjustments
  grayscale: true                 # occasional grayscale
  gaussian_blur: true             # light blurring
  perspective: false              # removed: heavy geometric distortion hurts validation
  affine: true                    # small affine transforms (translation, scale, shear)
  erasing: true                   # random erasing for regularization
  adjust_sharpness: false         # removed: extreme effect rarely helps generalization


batch_size: 128
shuffle: true
num_workers: 24
seed: 42
